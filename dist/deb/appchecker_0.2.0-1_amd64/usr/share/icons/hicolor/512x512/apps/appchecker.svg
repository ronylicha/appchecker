<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="64" ry="64" fill="url(#bg)" stroke="#533483" stroke-width="3"/>

  <!-- Terminal window frame -->
  <rect x="64" y="96" width="384" height="320" rx="16" ry="16" fill="#0a0a1a" stroke="#3a7bd5" stroke-width="2" opacity="0.9"/>

  <!-- Terminal title bar -->
  <rect x="64" y="96" width="384" height="36" rx="16" ry="16" fill="#1a1a3e"/>
  <rect x="64" y="116" width="384" height="16" fill="#1a1a3e"/>
  <circle cx="88" cy="114" r="6" fill="#e94560"/>
  <circle cx="108" cy="114" r="6" fill="#f5a623"/>
  <circle cx="128" cy="114" r="6" fill="#7ed321"/>

  <!-- Git branch lines -->
  <g stroke="#533483" stroke-width="3" fill="none" opacity="0.6">
    <path d="M 100 180 L 100 360" />
    <path d="M 100 220 C 100 220, 160 220, 160 260 C 160 300, 100 300, 100 300" />
    <path d="M 100 260 C 100 260, 180 260, 180 300 C 180 340, 100 340, 100 340" />
  </g>

  <!-- Commit dots on branches -->
  <circle cx="100" cy="180" r="8" fill="#00d2ff" filter="url(#glow)"/>
  <circle cx="100" cy="220" r="8" fill="#00d2ff" filter="url(#glow)"/>
  <circle cx="160" cy="260" r="8" fill="#e94560" filter="url(#glow)"/>
  <circle cx="100" cy="300" r="8" fill="#00d2ff" filter="url(#glow)"/>
  <circle cx="180" cy="300" r="8" fill="#f5a623" filter="url(#glow)"/>
  <circle cx="100" cy="340" r="8" fill="#00d2ff" filter="url(#glow)"/>
  <circle cx="100" cy="360" r="8" fill="#7ed321" filter="url(#glow)"/>

  <!-- Checkmark overlay -->
  <g transform="translate(280, 200)" filter="url(#glow)">
    <circle cx="80" cy="80" r="72" fill="none" stroke="url(#check)" stroke-width="6" opacity="0.3"/>
    <polyline points="40,80 70,110 120,50" fill="none" stroke="url(#check)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dependency arrows -->
  <g stroke="#7ed321" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 220 370 L 260 370" marker-end="url(#arrowhead)"/>
    <path d="M 280 370 L 320 370" marker-end="url(#arrowhead)"/>
    <path d="M 340 370 L 380 370" marker-end="url(#arrowhead)"/>
  </g>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7ed321"/>
    </marker>
  </defs>

  <!-- Package icons -->
  <rect x="210" y="358" width="20" height="24" rx="3" fill="#e94560" opacity="0.8"/>
  <rect x="270" y="358" width="20" height="24" rx="3" fill="#f5a623" opacity="0.8"/>
  <rect x="330" y="358" width="20" height="24" rx="3" fill="#00d2ff" opacity="0.8"/>
  <rect x="390" y="358" width="20" height="24" rx="3" fill="#7ed321" opacity="0.8"/>

  <!-- App name text -->
  <text x="256" y="468" font-family="monospace" font-size="36" font-weight="bold" fill="#00d2ff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">APPCHECKER</text>
</svg>